[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-expedition"
version = "0.0.1"
description = "Ambiente de RL ROBOT EXPEDITION: visitar dos balizas en orden y volver a la base."
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
robot-exp = "robot_expedition.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
